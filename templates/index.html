<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Colorization</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            min-height:100vh;

            background:#000000;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

            overflow-x:hidden;

            position:relative;

        }

        /* LEFT PINK NEON */

        body::before{

            content:"";

            position:absolute;

            left:70px;

            top:70px;

            width:320px;

            height:320px;

            border-left:5px solid #ff00ff;

            border-top:5px solid #ff00ff;

            box-shadow:
            0 0 15px #ff00ff,
            0 0 30px #ff00ff,
            0 0 60px #ff00ff;

            border-radius:6px;

        }

        /* RIGHT BLUE NEON */

        body::after{

            content:"";

            position:absolute;

            right:70px;

            bottom:70px;

            width:320px;

            height:320px;

            border-right:5px solid #00aaff;

            border-bottom:5px solid #00aaff;

            box-shadow:
            0 0 15px #00aaff,
            0 0 30px #00aaff,
            0 0 60px #00aaff;

            border-radius:6px;

        }

        .container{

            width:100%;

            max-width:1200px;

            background:rgba(10,10,10,0.82);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:30px;

            padding:45px;

            position:relative;

            z-index:10;

            box-shadow:
            0 0 25px rgba(255,255,255,0.04);

        }

        .title{

            text-align:center;

            font-size:50px;

            font-weight:700;

            margin-bottom:12px;

            color:white;

            letter-spacing:1px;

            text-shadow:
            0 0 10px #ff00ff,
            0 0 20px #7b2cff,
            0 0 35px #00aaff;

        }

        .subtitle{

            text-align:center;

            color:#d1d5db;

            margin-bottom:40px;

            font-size:17px;

            line-height:1.7;

        }

        .upload-card{

            background:rgba(255,255,255,0.03);

            border:1px solid rgba(255,255,255,0.08);

            padding:35px;

            border-radius:22px;

            text-align:center;

            box-shadow:
            inset 0px 0px 20px rgba(255,255,255,0.02);

        }

        .file-input{

            width:100%;

            padding:18px;

            border-radius:15px;

            border:2px dashed rgba(255,255,255,0.18);

            background:rgba(255,255,255,0.03);

            color:white;

            margin-bottom:28px;

            cursor:pointer;

            transition:0.3s;

        }

        .file-input:hover{

            border-color:#00aaff;

            box-shadow:
            0 0 20px rgba(0,170,255,0.25);

        }

        .file-input::file-selector-button{

            background:linear-gradient(
                135deg,
                #ff00ff,
                #7b2cff,
                #00aaff
            );

            border:none;

            color:white;

            padding:12px 20px;

            border-radius:10px;

            margin-right:15px;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;

            box-shadow:
            0 0 12px #ff00ff,
            0 0 25px #00aaff;

        }

        .file-input::file-selector-button:hover{

            transform:scale(1.05);

            box-shadow:
            0 0 20px #ff00ff,
            0 0 40px #00aaff;

        }

        .btn{

            background:linear-gradient(
                135deg,
                #ff00ff,
                #7b2cff,
                #00aaff
            );

            border:none;

            color:white;

            padding:16px 42px;

            border-radius:14px;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.35s ease;

            letter-spacing:0.5px;

            box-shadow:
            0 0 12px #ff00ff,
            0 0 25px #7b2cff,
            0 0 45px #00aaff;

        }

        .btn:hover{

            transform:translateY(-3px) scale(1.04);

            box-shadow:
            0 0 20px #ff00ff,
            0 0 40px #7b2cff,
            0 0 70px #00aaff;

        }

        .result-section{

            margin-top:50px;

        }

        .result-title{

            text-align:center;

            color:white;

            font-size:32px;

            margin-bottom:35px;

            text-shadow:
            0 0 10px #ff00ff,
            0 0 20px #00aaff;

        }

        .image-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit, minmax(320px,1fr));

            gap:35px;

        }

        .image-card{

            background:rgba(255,255,255,0.03);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:24px;

            padding:22px;

            box-shadow:
            0 0 18px rgba(0,170,255,0.12);

            transition:0.3s;

        }

        .image-card:hover{

            transform:translateY(-5px);

            box-shadow:
            0 0 25px rgba(255,0,255,0.2),
            0 0 45px rgba(0,170,255,0.18);

        }

        .image-card h3{

            text-align:center;

            color:white;

            margin-bottom:20px;

            font-size:22px;

            font-weight:600;

        }

        .image-wrapper{

            width:100%;

            aspect-ratio:1/1;

            overflow:hidden;

            border-radius:18px;

            background:#050505;

            border:1px solid rgba(255,255,255,0.08);

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .image-wrapper img{

            width:100%;

            height:100%;

            object-fit:cover;

            border-radius:18px;

            transition:0.3s;

        }

        .image-wrapper img:hover{

            transform:scale(1.03);

        }

        .footer-text{

            text-align:center;

            margin-top:40px;

            color:#9ca3af;

            font-size:14px;

            letter-spacing:0.5px;

        }

        @media(max-width:768px){

            body::before,
            body::after{

                width:180px;
                height:180px;

            }

            .container{
                padding:28px;
            }

            .title{
                font-size:36px;
            }

            .subtitle{
                font-size:15px;
            }

            .image-grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="title">
            AI Image Colorization
        </h1>

        <p class="subtitle">
            Transform grayscale photographs into realistic colorized images using Deep Learning and Computer Vision.
        </p>

        <div class="upload-card">

            <form action="/predict" method="POST" enctype="multipart/form-data">

                <input
                    type="file"
                    name="image"
                    class="file-input"
                    accept="image/*"
                    required
                >

                <br>

                <button type="submit" class="btn">
                    Colorize Image
                </button>

            </form>

        </div>

        {% if uploaded_image and output_image %}

        <div class="result-section">

            <h2 class="result-title">
                Prediction Results
            </h2>

            <div class="image-grid">

                <div class="image-card">

                    <h3>Uploaded Image</h3>

                    <div class="image-wrapper">

                        <img
                            src="{{ uploaded_image }}"
                            alt="Uploaded Image"
                        >

                    </div>

                </div>

                <div class="image-card">

                    <h3>Colorized Output</h3>

                    <div class="image-wrapper">

                        <img
                            src="{{ output_image }}"
                            alt="Colorized Output"
                        >

                    </div>

                </div>

            </div>

        </div>

        {% endif %}

        <p class="footer-text">
            Built with Flask, TensorFlow, OpenCV & Deep Learning
        </p>

    </div>

</body>

</html>
